[project]
name = "lesson-plan-ai"
version = "0.1.0"
description = "Evidence-grounded lesson planning with RAG and Google ADK"
requires-python = ">=3.11"
dependencies = [
  "google-adk>=1.0.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "python-docx>=1.1",
  "qdrant-client>=1.9",
  "sentence-transformers>=3.0",
  "streamlit>=1.36",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lesson_plan_ai*"]
