[project]
name = "lesson-plan-ai"
version = "0.1.0"
description = "Evidence-grounded lesson planning with RAG and Google ADK"
requires-python = ">=3.11,<3.15"
dependencies = [
  "torch==2.13.0",
  "transformers==5.15.1",
  "google-genai==2.19.0",
  "pdfplumber==0.11.9",
  "google-adk==2.7.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "qdrant-client==1.19.0",
  "sentence-transformers==6.0.0",
  "streamlit==1.62.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.15.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lesson_plan_ai*"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
