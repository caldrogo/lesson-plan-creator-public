services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 192m
    environment:
      QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS: "1"
      QDRANT__STORAGE__OPTIMIZERS__MAX_OPTIMIZATION_THREADS: "1"
      QDRANT__STORAGE__HNSW_INDEX__MAX_INDEXING_THREADS: "1"
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
  ingest:
    build: .
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 640m
    profiles: [setup]
    depends_on:
      - qdrant
    environment:
      LP_QDRANT_URL: http://qdrant:6333
      LP_EMBEDDING_BATCH_SIZE: "8"
      LP_INGESTION_BATCH_SIZE: "8"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - embedding_cache:/root/.cache/huggingface
    command: ["python", "-m", "lesson_plan_ai.v2.cli", "index"]
  app:
    build: .
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 640m
    depends_on:
      - qdrant
    ports:
      - "8501:8501"
    environment:
      LP_QDRANT_URL: http://qdrant:6333
      LP_EMBEDDING_BATCH_SIZE: "8"
      LP_INGESTION_BATCH_SIZE: "8"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - embedding_cache:/root/.cache/huggingface
volumes:
  qdrant_data:
  embedding_cache:
